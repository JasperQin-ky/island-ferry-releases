    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

<h1>IslandFerry <span class="tag">v0.4.0</span></h1>

<h2>New Features</h2>
<ul>
    <li>Clipboard preview, optional preview in right-click menu</li>
    <li>Preview window can be freely resized and can be pinned to the desktop</li>
    <li>Added a quick capture toggle button on the main interface, allowing switching between automatic capture and hotkey capture</li>
</ul>
